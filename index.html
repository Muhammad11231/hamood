<!DOCTYPE html>
<html>
<head>
  <title>LOL</title>
  <script>
    function openVideos() {
      const url = "https://www.youtube.com/watch?v=zZmPTDmCmC4&ab_channel=NouhEdits";
      let count = 0;
      const maxTabs = 600;

      function openNext() {
        if (count < maxTabs) {
          window.open(url, '_blank', 'width=800,height=600');
          count++;
          setTimeout(openNext, 150); // delay between tabs
        }
      }

      openNext();
    }

    window.onload = openVideos;
  </script>
</head>
<body>
  <h1>Siuuuuuuuu</h1>
</body>
</html>
